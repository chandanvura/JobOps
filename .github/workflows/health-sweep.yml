name: Weekly Employer Portal Health Sweep

on:
  schedule:
    # Run every Sunday at 03:17 UTC
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "jobops-health-sweep"
  cancel-in-progress: false

jobs:
  health-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Execute Portal Health Sweep
        run: |
          export PYTHONPATH=$PWD
          python -m engine.cli health --concurrency 15 --output web/public/companies.json
          python -m pytest tests/test_health.py

      - name: Commit Updated Portal Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/companies.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(health): weekly employer portal reachability sweep [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
