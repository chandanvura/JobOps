name: Ingest 24h Engineering Jobs

on:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      all_time:
        description: "Include historical jobs (not just 24h)"
        required: false
        default: false
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JobOps Ingestion Pipeline
        run: |
          export PYTHONPATH=$PWD
          if [ "${{ inputs.all_time }}" = "true" ]; then
            python -m engine.cli run --all-time
          else
            python -m engine.cli run
          fi

      - name: Export Active Catalogue
        run: |
          export PYTHONPATH=$PWD
          python -m engine.cli export --output web/public/jobs.json

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(catalog): auto-sync latest 24h engineering jobs [skip ci]" && git push)
