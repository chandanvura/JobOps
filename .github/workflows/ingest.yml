name: Ingest 24h Engineering Jobs & Deploy

on:
  schedule:
    # Run every 2 hours at minute 23 (offset from top of hour to avoid runner congestion)
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      all_time:
        description: "Include historical jobs (not just 24h)"
        required: false
        default: false
        type: boolean
      force_export:
        description: "Bypass LKG >25% drop safety guard"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-ingest]

permissions:
  contents: read

concurrency:
  group: "jobops-ingestion"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ingest-and-build:
    name: Ingest, Heal & Build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install Python Dependencies (uv)
        run: uv pip install -r requirements.txt

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit

      - name: Restore Persistent SQLite Telemetry & Circuit-Breaker State
        uses: actions/cache@v6
        with:
          path: data/jobops.db*
          key: jobops-sqlite-${{ github.run_id }}
          restore-keys: |
            jobops-sqlite-

      - name: Run JobOps Ingestion Pipeline
        id: ingest
        run: |
          if [ "${{ inputs.all_time }}" = "true" ]; then
            python -m engine.cli run --all-time --concurrency 25
          else
            python -m engine.cli run --concurrency 25
          fi

      - name: Reap Closed Job URLs & Export Active Catalogue (with LKG Guard)
        run: |
          python -m engine.cli reap --sample 120 --concurrency 15
          if [ "${{ inputs.force_export }}" = "true" ]; then
            python -m engine.cli export --output web/public/jobs.json --force
          else
            python -m engine.cli export --output web/public/jobs.json
          fi

      - name: Run Frontend Tests & Production Build (Vite 8 + Tailwind v4)
        working-directory: web
        run: |
          npm test
          npm run build

      - name: Auto-Heal & Validate Catalog Quality via Playbooks
        run: |
          python -m engine.cli playbook resolve --auto
          python -m pytest -q

      - name: Publish SRE Pipeline Summary
        if: always()
        run: |
          python - << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          t_path = Path("web/public/telemetry.json")
          print("## JobOps Production Ingestion Summary\n")
          print(f"- **Runner**: `ubuntu-26.04` (Python 3.12 + `uv`, Node 24 LTS)")
          if t_path.exists():
              t = json.loads(t_path.read_text(encoding="utf-8"))
              cat = t.get("catalog", {})
              run = t.get("last_run") or {}
              obs = t.get("observability") or {}
              print("\n| Metric | Value |")
              print("|---|---|")
              print(f"| Total Active Engineering Jobs | **{cat.get('total_engineering_jobs', 0):,}** |")
              print(f"| Fresh 24h Roles | **{cat.get('fresh_24h_jobs', 0):,}** |")
              print(f"| Open Circuit Breakers (PB-005) | **{cat.get('tripped_circuits', 0)}** |")
              print(f"| New Jobs Saved This Run | **{run.get('new_jobs_saved', 0)}** |")
              print(f"| Run Duration | **{run.get('duration_seconds', 'n/a')}s** |")
              if obs:
                  print(f"| SRE SLO Status | **{obs.get('slo_status', 'N/A')}** ({obs.get('success_rate', 0):.1%}) |")
                  drift = obs.get("schema_drift_suspected") or []
                  print(f"| ATS Schema Drift Canary | **{', '.join(drift) if drift else 'None detected'}** |")
          else:
              print("_No telemetry.json snapshot found for this run._")
          EOF

      - name: Commit and Push Updated Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/jobs.json web/public/companies.json web/public/telemetry.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(catalog): auto-sync latest 24h engineering jobs [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "web/dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: ingest-and-build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
