name: Ingest 24h Engineering Jobs & Deploy

on:
  schedule:
    # Run every 2 hours automatically
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      all_time:
        description: "Include historical jobs (not just 24h)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JobOps Ingestion Pipeline
        run: |
          export PYTHONPATH=$PWD
          if [ "${{ inputs.all_time }}" = "true" ]; then
            python -m engine.cli run --all-time
          else
            python -m engine.cli run
          fi

      - name: Export Active Catalogue
        run: |
          export PYTHONPATH=$PWD
          python -m engine.cli export --output web/public/jobs.json

      - name: Auto-Heal & Validate Catalog Quality via Playbooks
        run: |
          export PYTHONPATH=$PWD
          python -m engine.cli playbook resolve --auto
          python -m pytest -o pythonpath=. tests

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/jobs.json web/public/companies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(catalog): auto-sync latest 24h engineering jobs [skip ci]" && git push)

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Dashboard
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
