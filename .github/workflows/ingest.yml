name: Ingest 24h Engineering Jobs & Deploy

on:
  schedule:
    # Run every 2 hours at minute 23 (offset from top of hour to avoid runner congestion)
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      all_time:
        description: "Include historical jobs (not just 24h)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-ingest]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "jobops-ingestion"
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run JobOps Ingestion Pipeline
        run: |
          export PYTHONPATH=$PWD
          if [ "${{ inputs.all_time }}" = "true" ]; then
            python -m engine.cli run --all-time --concurrency 25
          else
            python -m engine.cli run --concurrency 25
          fi

      - name: Export Active Catalogue
        run: |
          export PYTHONPATH=$PWD
          python -m engine.cli export --output web/public/jobs.json --limit 5000

      - name: Auto-Heal & Validate Catalog Quality via Playbooks
        run: |
          python -m engine.cli playbook resolve --auto
          python -m pytest

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/jobs.json web/public/companies.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(catalog): auto-sync latest 24h engineering jobs [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci --prefer-offline

      - name: Build Web Dashboard
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

  deploy:
    needs: ingest-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
