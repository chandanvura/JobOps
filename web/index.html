    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JobOps — Engineering Intelligence Radar</title>
    <meta name="description" content="Production-grade engineering job discovery platform for India. Ingests directly from 757+ verified tech employers via native ATS endpoints with strict 24-hour freshness." />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const mode = localStorage.getItem("jobops_theme_mode") || localStorage.getItem("jobops_theme");
        const isDark = mode === "dark" || ((!mode || mode === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = mode === "dark" ? "dark" : (mode === "light" ? "light" : "light dark");
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.json" />

    <!-- Open Graph & Social Sharing Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobOps — Engineering Intelligence Radar" />

    <meta property="og:url" content="https://chandanvura.github.io/JobOps/" />
    <meta name="twitter:card" content="summary" />
